<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Salvage Leads</title>
<style>
/* Layout: one-screen field tool for walking. Top bar + filter rail + Map/List tabs; map has floating controls; a bottom sheet holds one spot. */
:root {
  --bg: #eceff1; --surface: #ffffff; --sunk: #e1e6ea; --fg: #1a2126; --muted: #5b6670; --line: #d3d9de;
  --map: #e4e8eb; --maplabel: #7f8a94; --water: #b3cde0; --road: #ffffff; --road2: #f3d27e; --road3: #e9a85a; --streetlabel: #4f5a63;
  --demo: #e04e17; --gut: #d39200; --remodel: #1d7d8f; --historic: #7a4fb0; --new: #8a5a2b; --mine: #d6336c;
  --demo-ink: #b83c0e; --gut-ink: #8a5f00; --remodel-ink: #15606e; --historic-ink: #5f3a91; --new-ink: #774b20; --mine-ink: #b02457;
  --star: #f5b800; --good: #2f8a3e; --me: #1a73e8; --me-halo: rgba(26,115,232,.18);
  --display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Roboto Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161a; --surface: #1b2125; --sunk: #232a2f; --fg: #e6eaed; --muted: #98a3ac; --line: #2c343a;
    --map: #171c20; --maplabel: #6c7983; --water: #0f2330; --road: #2e373e; --road2: #57513b; --road3: #6e5634; --streetlabel: #9aa5ae;
    --demo: #ff6b34; --gut: #f3b221; --remodel: #3db3c8; --historic: #b48ce3; --new: #d4a06a; --mine: #ff5c93;
    --demo-ink: #ff8a5c; --gut-ink: #f6c453; --remodel-ink: #6cc9d9; --historic-ink: #c8a8ee; --new-ink: #e0b98e; --mine-ink: #ff86ae;
    --star: #ffcc33; --good: #58b968; --me: #4c9bff; --me-halo: rgba(76,155,255,.22);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; overscroll-behavior: none; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.top { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
.titlerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 25px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.status { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.25; }
.status b { font-weight: 600; color: var(--fg); }
.rail { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 1px 14px; }
.rail::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; font-size: 12px; }
.chip svg { width: 14px; height: 14px; }
.sep { flex: none; width: 1px; background: var(--line); margin: 6px 2px; }
.glyph { width: 11px; height: 11px; flex: none; }
.glyph.demo { background: var(--demo); }
.glyph.gut { background: var(--gut); transform: rotate(45deg) scale(.82); }
.glyph.remodel { background: var(--remodel); border-radius: 50%; }
.glyph.historic { background: var(--historic); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.glyph.new { background: var(--new); clip-path: polygon(50% 0, 100% 42%, 100% 100%, 0 100%, 0 42%); }
.glyph.mine { background: var(--mine); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }

.tabs { flex: none; display: flex; gap: 6px; padding: 7px max(14px, env(safe-area-inset-right, 0px)) 7px max(14px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.tab { flex: 1; height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.main { position: relative; flex: 1; min-height: 0; }
.mapwrap, .listpane { position: absolute; inset: 0; }
.mapwrap { overflow: hidden; background: var(--map); touch-action: none; }
#map { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; }
.water { fill: var(--water); }
.road { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.road.local { stroke: var(--road); stroke-width: 1.4px; }
.road.major { stroke: var(--road2); stroke-width: 3px; }
.road.hwy { stroke: var(--road3); stroke-width: 4px; }
#map.far .road.local { stroke-width: .7px; } #map.far .road.major { stroke-width: 1.8px; } #map.far .road.hwy { stroke-width: 2.4px; }
.slbl { fill: var(--streetlabel); font-family: var(--body); font-weight: 500; paint-order: stroke; stroke: var(--map); stroke-linejoin: round; }
.lbl { fill: var(--maplabel); font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; paint-order: stroke; stroke: var(--map); stroke-linejoin: round; }
.pin .shape { stroke: var(--surface); }
.pin.sel .shape { stroke: var(--fg); }
.pin.visited { opacity: .35; }
.shape.demo { fill: var(--demo); } .shape.gut { fill: var(--gut); } .shape.remodel { fill: var(--remodel); } .shape.historic { fill: var(--historic); } .shape.new { fill: var(--new); } .shape.mine { fill: var(--mine); }
.badge-star { fill: var(--star); stroke: #1a2126; }
.badge-saved { fill: none; stroke: var(--fg); }
.me-halo { fill: var(--me-halo); stroke: var(--me); stroke-opacity: .35; }
.me-dot { fill: var(--me); stroke: #fff; }

.ctl { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; flex-direction: column; gap: 6px; }
.mbtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.15); font-size: 22px; line-height: 1; }
.mbtn svg { width: 22px; height: 22px; }
.mbtn.on { background: var(--me); color: #fff; border-color: var(--me); }
.mbtn.small { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.fab { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); height: 50px; padding: 0 18px 0 14px; border-radius: 25px; border: 0; background: var(--mine); color: #fff; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; box-shadow: 0 3px 10px rgba(0,0,0,.28); }
.fab svg { width: 22px; height: 22px; }
.scale { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 12px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scale .bar { height: 6px; border: 2px solid var(--muted); border-top: 0; margin-top: 2px; }
.attrib { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(4px + env(safe-area-inset-bottom, 0px)); font-size: 10px; color: var(--maplabel); pointer-events: none; }
.cross[hidden] { display: none; }
.cross { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; color: var(--mine); }
.placebar { position: absolute; left: 10px; right: 10px; top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 3px 12px rgba(0,0,0,.2); }
.placebar p { margin: 0; flex: 1; font-size: 14px; }

.listpane { overflow-y: auto; padding: 10px max(10px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; width: 100%; }
.row.visited { opacity: .55; }
.row .ic { padding-top: 5px; }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .a { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.1; }
.row .s { font-size: 13.5px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .d { flex: none; text-align: right; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .d small { display: block; font-weight: 400; color: var(--muted); }
.row .marks { display: flex; gap: 6px; margin-top: 3px; font-size: 12px; color: var(--muted); }
.mk { display: inline-flex; align-items: center; gap: 3px; }
.mk svg { width: 13px; height: 13px; }
.mk.star { color: var(--fg); } .mk.star svg { fill: var(--star); stroke: #1a2126; }
.listhead { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 2px 4px; }
.empty { color: var(--muted); padding: 40px 12px; text-align: center; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 82%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.25); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-bottom: 2px; }
.closex { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border-radius: 18px; border: 0; background: var(--sunk); font-size: 20px; line-height: 1; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-right: 44px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.tag.demo { color: var(--demo-ink); } .tag.gut { color: var(--gut-ink); } .tag.remodel { color: var(--remodel-ink); } .tag.historic { color: var(--historic-ink); } .tag.new { color: var(--new-ink); } .tag.mine { color: var(--mine-ink); }
.phase { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--sunk); color: var(--muted); }
.phase.live { color: var(--good); }
.addr { margin: 0; font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; }
.where { font-size: 13.5px; color: var(--muted); margin-top: -6px; }
.where b { color: var(--fg); font-weight: 600; }
.tags { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tbtn { height: 58px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12.5px; font-weight: 600; }
.tbtn svg { width: 20px; height: 20px; }
.tbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tbtn.star[aria-pressed="true"] { background: var(--star); color: #1a2126; border-color: var(--star); }
.tbtn.star[aria-pressed="true"] svg { fill: #1a2126; }
.tbtn.visit[aria-pressed="true"] { background: var(--good); color: #fff; border-color: var(--good); }
.seen { font-size: 12.5px; color: var(--muted); margin-top: -4px; }
.go { display: flex; gap: 8px; }
.btn { flex: 1; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.danger { color: var(--demo-ink); }
.btn svg { width: 18px; height: 18px; }
textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px; font-size: 15px; }
.sum { margin: 0; }
details { font-size: 13px; color: var(--muted); }
details summary { padding: 4px 0; }
details p { margin: 6px 0 0; }
.permit { font-family: var(--mono); font-size: 12px; color: var(--fg); }
.warn { margin: 0; font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; }
.warn.historic { border-left-color: var(--historic); } .warn.new { border-left-color: var(--new); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); border-radius: 22px; padding: 0 6px 0 16px; height: 44px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.3); font-size: 14px; white-space: nowrap; max-width: calc(100% - 24px); }
.toast button { height: 34px; border: 0; border-radius: 17px; padding: 0 14px; background: transparent; color: var(--star); font-weight: 700; }
.newform { display: flex; flex-direction: column; gap: 10px; }
.newform label { font-size: 13px; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 4px 0; }
.check input { width: 22px; height: 22px; accent-color: var(--star); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titlerow">
      <h1>Salvage Leads</h1>
      <div class="status" id="status">Loading…</div>
    </div>
    <div class="rail" id="filters" role="group" aria-label="Filter spots"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-map" aria-selected="true">Map</button>
    <button class="tab" role="tab" id="t-list" aria-selected="false">List</button>
  </nav>
  <main class="main" id="main">
    <section class="mapwrap" id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Map">
        <defs id="defs"></defs>
        <path id="water" class="water" fill-rule="evenodd" d=""/>
        <g id="roads"></g><g id="slabels"></g><g id="labels"></g><g id="me"></g><g id="pins"></g>
      </svg>
      <div class="scale" id="scale"></div>
      <div class="ctl">
        <button class="mbtn" id="locate" aria-label="Show my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
        <button class="mbtn" id="zin" aria-label="Zoom in">+</button>
        <button class="mbtn" id="zout" aria-label="Zoom out">−</button>
        <button class="mbtn small" id="zfit" aria-label="Show all spots">ALL</button>
      </div>
      <button class="fab" id="addspot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add spot</button>
      <svg class="cross" id="cross" viewBox="0 0 44 44" hidden><circle cx="22" cy="22" r="9" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 2v12M22 30v12M2 22h12M30 22h12" stroke="currentColor" stroke-width="3"/></svg>
      <div class="placebar" id="placebar" hidden><p>Drag the map to put the crosshair on the spot.</p><button class="btn" id="placecancel" style="flex:none;padding:0 12px">Cancel</button><button class="btn primary" id="placeok" style="flex:none;padding:0 14px">Here</button></div>
      <div class="attrib">Streets: US Census TIGER/Line · Permits: City of Portland</div>
    </section>
    <section class="listpane" id="list" hidden></section>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden><span id="toastmsg"></span><button id="toastundo">Undo</button></div>

<script src="native.js" onerror="void 0"></script>
<script>
(() => {
  "use strict";
  const REMOTE = "https://raw.githubusercontent.com/ronaldodaiqui/salvage-leads/main/data/leads.json";
  const N = window.Native || {};
  const CATS = { demo: "Demolition", new: "New build", historic: "Historic", gut: "Interior demo", remodel: "Remodel", mine: "My spot" };
  const ORDER = { mine: 0, demo: 1, new: 2, historic: 3, gut: 4, remodel: 5 };
  const AREAS = [["Munjoy Hill", 43.6665, -70.2468], ["Old Port", 43.6573, -70.2534], ["West End", 43.649, -70.2703], ["Back Cove", 43.6783, -70.2765],
    ["Deering", 43.6759, -70.2984], ["North Deering", 43.7034, -70.2856], ["Riverton", 43.7009, -70.3111], ["Stroudwater", 43.6571, -70.3289],
    ["East Deering", 43.6886, -70.2555], ["Libbytown", 43.6522, -70.2884], ["Peaks Island", 43.6555, -70.1945]];
  const ICON = {
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.8l2.7 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16.6l-5.7 3.3 1.4-6.3L2.9 9.3l6.4-.6z"/></svg>',
    save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
    visit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>',
    hide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20L20 4"/></svg>',
    walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M8 12l2-4 4 1 2 4M10 8l-1 5 3 2"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5zM3 16h18v3H3z"/><circle cx="7.5" cy="13.5" r=".5"/><circle cx="16.5" cy="13.5" r=".5"/></svg>'
  };

  // ---------- state ----------
  let data = null;           // {through, generated, leads}
  let leads = [];            // permit leads
  let spots = [];            // the user's own spots
  let tags = {};             // id -> {star, saved, visited, hidden, note}
  let filter = "all", hideVisited = false, selected = null, view = "map";
  let me = null, follow = false, locState = "off";   // off | asking | on | denied | error
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- storage ----------
  const store = {
    async get(k) {
      try { if (N.Preferences) { const r = await N.Preferences.get({ key: k }); if (r && r.value) return JSON.parse(r.value); } } catch (_) {}
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (_) { return null; }
    },
    async set(k, v) {
      const s = JSON.stringify(v);
      try { if (N.Preferences) await N.Preferences.set({ key: k, value: s }); } catch (_) {}
      try { localStorage.setItem(k, s); } catch (_) {}
    }
  };
  const saveTags = () => store.set("sl.tags", tags);
  const saveSpots = () => store.set("sl.spots", spots);
  const T = (id) => tags[id] || {};
  function setTag(id, key, val) {
    const t = Object.assign({}, tags[id] || {});
    if (val) t[key] = val; else delete t[key];
    if (Object.keys(t).length) tags[id] = t; else delete tags[id];
    saveTags();
  }

  // ---------- geometry ----------
  const LAT0 = 43.675, LNG0 = -70.27, KM = 111.32, COS = Math.cos(LAT0 * Math.PI / 180);
  const px = (lng) => (lng - LNG0) * COS * KM, py = (lat) => -(lat - LAT0) * KM;
  const toLng = (x) => x / (COS * KM) + LNG0, toLat = (y) => -y / KM + LAT0;
  function meters(a, b) {
    const R = 6371000, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

      `<details><summary>City permit text</summary><p>${esc(l.detail || "")}</p><p><span class="permit">${esc(l.num)}</span> · ${esc(l.status || "")}${l.expires ? " · good through " + fmtDate(l.expires) : ""}</p></details>`;
    $("sheet").innerHTML = `
      <div class="grab"></div>
      <button class="closex" id="closex" aria-label="Close">×</button>
      <div class="meta"><span class="tag ${l.cat}"><span class="glyph ${l.cat}"></span>${CATS[l.cat]}</span><span class="phase${p.live ? " live" : ""}">${esc(p.text)}</span></div>
      <h2 class="addr">${esc(l.addr)}</h2>
      <div class="where" id="whereline">${whereLine(l)}</div>
      ${l.summary && l.cat !== "mine" ? `<p class="sum">${esc(l.summary)}</p>` : ""}
      <div class="tags">${tb("star", "star", ICON.star, "Dumpster")}${tb("saved", "save", ICON.save, "Save")}${tb("visited", "visit", ICON.visit, "Visited")}${tb("hidden", "hide", ICON.hide, "Hide")}</div>
      ${seen.length ? `<div class="seen">${seen.join(" · ")}</div>` : ""}
      <div class="go"><button class="btn primary" id="walk">${ICON.walk}Walk here</button><button class="btn" id="drive">${ICON.car}Drive</button></div>
      <textarea id="note" placeholder="Add a note: what's there, when the crew is around…">${esc(t.note || (l.cat === "mine" ? l.summary || "" : ""))}</textarea>
      ${warn}
      ${details}`;
    $("sheet").hidden = false; $("scrim").hidden = false;
    $("sheet").scrollTop = 0;
    renderMap();
    if (view === "map") { const r = svg.getBoundingClientRect(); const sh = $("sheet").getBoundingClientRect().height; const visibleH = r.height - Math.max(0, sh - (window.innerHeight - r.bottom)); if (visibleH > 120) { const u = upp(); vw.cx = px(l.lng); vw.cy = py(l.lat) + (r.height / 2 - visibleH / 2) * u; setFollow(false); renderMap(); } }
  }
  function refreshSheetDistance() { const l = byId(sheetId); const el = $("whereline"); if (l && el) el.innerHTML = whereLine(l); }
  function closeSheet() {
    const n = $("note");
    if (n && sheetId) commitNote();
    sheetId = null; selected = null;
    $("sheet").hidden = true; $("scrim").hidden = true; $("sheet").innerHTML = "";
    renderAll();
  }
  function commitNote() {
    const n = $("note"); if (!n || !sheetId) return;
    const l = byId(sheetId), v = n.value.trim();
    if (l && l.cat === "mine") { if (l.summary !== v) { l.summary = v; saveSpots(); } }
    else if ((T(sheetId).note || "") !== v) setTag(sheetId, "note", v);
  }
  $("scrim").onclick = closeSheet;
  $("sheet").addEventListener("input", (e) => { if (e.target.id === "note") { sheetDirty = true; clearTimeout(noteT); noteT = setTimeout(commitNote, 700); } });
  let noteT = 0, delArmed = 0;
  $("sheet").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const id = sheetId, l = byId(id);
    if (b.id === "closex") return closeSheet();
    if (b.id === "walk") return openExternal(dirLink(l, "walking"));
    if (b.id === "drive") return openExternal(dirLink(l, "driving"));
    if (b.id === "delspot") {
      if (Date.now() - delArmed > 3000) { delArmed = Date.now(); b.textContent = "Tap again to delete"; return; }
      const removed = l, idx = spots.indexOf(l);
      spots = spots.filter((s) => s !== l); delete tags[id]; saveSpots(); saveTags(); closeSheet();
      toast("Spot deleted", () => { spots.splice(idx, 0, removed); saveSpots(); renderAll(); });
      return;
    }
    const k = b.dataset.tag; if (!k) return;
    commitNote();
    const was = T(id)[k];
    setTag(id, k, was ? 0 : new Date().toISOString());
    if (k === "hidden" && !was) {
      closeSheet();
      toast("Spot hidden", () => { setTag(id, "hidden", 0); renderAll(); });
      return;
    }
    if (k === "star" && !was) toast("Starred as a dumpster");
    openSheet(id); renderFilters(); if (view === "list") renderList();
  });

  // ---------- add a spot ----------
  let placing = false;
  $("addspot").onclick = () => {
    setView("map");
    if (me) centerOn(me.lat, me.lng, Math.min(vw.w, 0.8));
    setFollow(false);
    placing = true;
    $("cross").removeAttribute("hidden"); $("placebar").hidden = false; $("addspot").hidden = true;
  };
  function endPlacing() { placing = false; $("cross").setAttribute("hidden", ""); $("placebar").hidden = true; $("addspot").hidden = false; }
  $("placecancel").onclick = endPlacing;
  $("placeok").onclick = () => { const [x, y] = mid(); const p = screenToLatLng(x, y); endPlacing(); openNewSpot(p.lat, p.lng); };
  function openNewSpot(lat, lng) {
    sheetId = null; selected = null;
    $("sheet").innerHTML = `
      <div class="grab"></div>
      <button class="closex" id="newclose" aria-label="Close">×</button>
      <div class="meta"><span class="tag mine"><span class="glyph mine"></span>New spot</span></div>
      <div class="where">Near ${esc(areaOf(lat, lng))}${me ? " · " + distText(meters(me, { lat, lng })).d + " from you" : ""}</div>
      <form class="newform" id="newform">
        <label for="newname">Name</label>
        <input id="newname" style="height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px" placeholder="e.g. Dumpster behind the bakery" maxlength="80">
        <label for="newnote">Note</label>
        <textarea id="newnote" placeholder="What's there?"></textarea>
        <label class="check"><input type="checkbox" id="newstar" checked> There's a dumpster here</label>
        <div class="go"><button type="button" class="btn" id="newcancel">Cancel</button><button type="submit" class="btn primary">Save spot</button></div>
      </form>`;
    $("sheet").hidden = false; $("scrim").hidden = false;
    $("newcancel").onclick = closeSheet; $("newclose").onclick = closeSheet;
    $("newform").onsubmit = (e) => {
      e.preventDefault();
      const now = new Date().toISOString();
      const s = { num: "mine-" + Date.now().toString(36), cat: "mine", lat: +lat.toFixed(6), lng: +lng.toFixed(6), addr: $("newname").value.trim() || "My spot", summary: $("newnote").value.trim(), created: now, area: areaOf(lat, lng) };
      spots.unshift(s); saveSpots();
      if ($("newstar").checked) setTag(s.num, "star", now);
      closeSheet(); toast("Spot saved"); openSheet(s.num);
    };
  }

  // ---------- toast ----------
  let toastT = 0, undoFn = null;
  function toast(msg, undo) {
    $("toastmsg").textContent = msg; undoFn = undo || null;
    $("toastundo").hidden = !undo; $("toast").hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { $("toast").hidden = true; undoFn = null; }, undo ? 5000 : 2200);
  }
  $("toastundo").onclick = () => { if (undoFn) undoFn(); undoFn = null; $("toast").hidden = true; };

  // ---------- data ----------
  async function fetchJson(url, ms) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 8000);
    try { const r = await fetch(url, { signal: ctl.signal, cache: "no-store" }); if (!r.ok) return null; return await r.json(); } catch (_) { return null; } finally { clearTimeout(t); }
  }
  function applyData(d) {
    if (!d || !Array.isArray(d.leads)) return false;
    if (data && data.generated && d.generated && d.generated <= data.generated) return false;
    data = d; leads = d.leads.filter((l) => l && l.num && typeof l.lat === "number");
    return true;
  }
  async function loadData() {
    const [cached, bundled] = await Promise.all([store.get("sl.data"), fetchJson("data/leads.json", 4000)]);
    applyData(bundled); applyData(cached);
    renderAll(); if (!placedOnce) initialView();
    const remote = await fetchJson(REMOTE + "?t=" + Date.now(), 10000);
    if (applyData(remote)) { store.set("sl.data", remote); renderAll(); toast("Spots updated to " + fmtDate(remote.through)); }
  }
  let placedOnce = false;
  function initialView() { placedOnce = true; if (me) centerOn(me.lat, me.lng, 1.6); else fit(); }

  function renderAll() { renderFilters(); renderStatus(); if (view === "list") renderList(); renderMap(); }

  // ---------- Android back button ----------
  if (N.App) N.App.addListener("backButton", () => {
    if (!$("sheet").hidden) return closeSheet();
    if (placing) return endPlacing();
    if (view === "list") return setView("map");
    N.App.exitApp();
  });

  // ---------- start ----------
  (async () => {
    tags = (await store.get("sl.tags")) || {};
    spots = (await store.get("sl.spots")) || [];
    hideVisited = !!(await store.get("sl.hidevisited"));
    if ((await store.get("sl.view")) === "list") setView("list");
    renderAll();
    loadBasemap();
    await loadData();
    setFollow(true);
    startLocation();
  })();
})();
</script>
</body>
</html>
